# Local development stack. `pnpm infra:up` from the repo root.
name: anomalia

services:
  postgres:
    # pgvector image rather than plain postgres: the knowledge embeddings table
    # needs the extension, and installing it by hand on every machine is how
    # "works on my laptop" starts.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: anomalia
      POSTGRES_PASSWORD: anomalia
      POSTGRES_DB: anomalia
    ports: ['5432:5432']
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anomalia -d anomalia']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF on: the event streams are durable state, not a cache. Losing them on
    # a container restart would lose in-flight events.
    command: redis-server --appendonly yes
    ports: ['6379:6379']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
