[project]
name = "anomalia-ai-worker"
version = "0.1.0"
description = "ANOMALIA AI worker: RAG, agent orchestration and embedding pipeline."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.1",
    "asyncpg>=0.30.0",
    "httpx>=0.28.1",
    "structlog>=24.4.0",
    "anthropic>=0.42.0",
    "openai>=1.58.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.25.0", "ruff>=0.8.4", "mypy>=1.14.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"

# asyncpg ships neither stubs nor a py.typed marker, so strict mode refuses to
# import it at all. Narrowed to that one package: everything else in the tree
# stays fully checked, and the untyped surface is the handful of pool calls in
# `core/db.py` rather than the whole worker.
[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
